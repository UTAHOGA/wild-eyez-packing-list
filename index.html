<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wild Eyez Continuous Document Test</title>
  <style>
    :root{
      --bg:#1b120c;
      --panel:#f7efe4;
      --ink:#2d2318;
      --accent:#ff7720;
      --accent2:#ff9a3d;
      --line:#dcc9b1;
      --shadow:0 18px 40px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      color:var(--ink);
      background:
        linear-gradient(rgba(28,19,12,.92), rgba(28,19,12,.95)),
        url("assets/logos/dark-brown-topo.jpg?v=20260804") center top / 820px auto repeat;
      background-attachment:fixed;
    }
    a{color:inherit}
    .bar{
      position:sticky;
      top:8px;
      z-index:20;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      width:min(960px, calc(100% - 24px));
      margin:8px auto 0;
      border-radius:18px;
      background:
        linear-gradient(180deg, rgba(52,32,18,.98), rgba(25,16,10,.98)),
        url("assets/logos/white-topo.jpg?v=20260804") center top / 760px auto repeat;
      background-blend-mode:multiply;
      box-shadow:var(--shadow);
    }
    .title{
      color:#fff1df;
      font:900 12px/1 Arial,sans-serif;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      align-items:center;
    }
    .player{
      width:100%;
      margin-top:6px;
    }
    .player audio{
      width:100%;
      display:block;
      height:42px;
      color-scheme:dark;
    }
    .prompt{
      display:none;
      margin-top:6px;
      padding:8px 10px;
      border-radius:12px;
      background:rgba(255,255,255,.1);
      border:1px solid rgba(255,255,255,.16);
      color:#fff4e6;
      font:700 12px/1.35 Arial,sans-serif;
      letter-spacing:.04em;
    }
    .prompt.show{display:block}
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:34px;
      padding:0 12px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:999px;
      background:rgba(255,255,255,.08);
      color:#fff0df;
      text-decoration:none;
      font:800 12px/1 Arial,sans-serif;
      letter-spacing:.08em;
      text-transform:uppercase;
      transition:transform 140ms ease, box-shadow 140ms ease;
    }
    .btn:hover,.btn:focus-visible{
      transform:translateY(-3px);
      box-shadow:0 12px 22px rgba(0,0,0,.22);
    }
    .btn.primary{
      background:linear-gradient(180deg,var(--accent2),var(--accent));
      color:#fff8ef;
    }
    .home{
      border:0;
      background:transparent;
      padding:0 2px;
    }
    .home img{
      display:block;
      height:40px;
      width:auto;
    }
    .wrap{
      width:min(960px, calc(100% - 24px));
      margin:14px auto 32px;
    }
    .page{
      position:relative;
      margin:0 0 14px;
      border:1px solid rgba(220,201,177,.95);
      border-radius:16px;
      overflow:hidden;
      background:rgba(255,250,244,.98);
      box-shadow:var(--shadow);
      scroll-margin-top:120px;
    }
    .page.active{
      box-shadow:0 0 0 4px rgba(255,119,32,.25), var(--shadow);
    }
    .page-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:11px 14px;
      border-bottom:1px solid rgba(216,205,189,.72);
      background:rgba(255,119,32,.14);
      font:800 12px/1 Arial,sans-serif;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:#332710;
    }
    .page-body{
      background:#fff;
    }
    .page img{
      display:block;
      width:100%;
      height:auto;
    }
    @media (max-width: 700px){
      .bar{
        width:min(100%, calc(100% - 16px));
        margin:6px auto 0;
        top:8px;
        padding:10px;
      }
      .wrap{width:min(100%, calc(100% - 16px)); margin-top:10px}
      .home img{height:38px}
      .page-head{padding:10px 12px}
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="title">Continuous Document Test</div>
    <div class="controls">
      <a class="btn primary" href="https://drive.google.com/uc?export=download&id=18fHtcDO4hu5IMwyJX3eJC5rAJrJm6dc6" target="_blank" rel="noopener noreferrer">Download PDF</a>
      <a class="btn" href="https://drive.google.com/file/d/18fHtcDO4hu5IMwyJX3eJC5rAJrJm6dc6/view?usp=sharing" target="_blank" rel="noopener noreferrer">View PDF</a>
      <a class="btn home" href="https://www.wildeyez.net" target="_blank" rel="noopener noreferrer" aria-label="Wild Eyez Home">
        <img src="assets/logos/WILD EYEZ HOME BUTTON.png?v=20260804" alt="">
      </a>
    </div>
    <div class="player">
      <audio id="guideAudio" controls preload="metadata" src="WILD EYEZ PACKING AND PREPARATION GUIDE AUDIO.mp3?v=20260804"></audio>
    </div>
    <div class="prompt" id="audioPrompt">Press play or wait for autoplay.</div>
  </header>

  <main class="wrap" id="pages">
    <section class="page" data-time="0">
      <div class="page-head"><span>Page 1</span><span>Introduction</span></div>
      <div class="page-body"><img src="assets/pages/WILD EYEZ PACKING AND PREPARATION GUIDE_Page_1.jpg?v=20260804" alt="Wild Eyez PDF page 1"></div>
    </section>
    <section class="page" data-time="50">
      <div class="page-head"><span>Page 2</span><span>Welcome</span></div>
      <div class="page-body"><img src="assets/pages/WILD EYEZ PACKING AND PREPARATION GUIDE_Page_2.jpg?v=20260804" alt="Wild Eyez PDF page 2"></div>
    </section>
    <section class="page" data-time="115">
      <div class="page-head"><span>Page 2</span><span>Safety First</span></div>
      <div class="page-body"><img src="assets/pages/WILD EYEZ PACKING AND PREPARATION GUIDE_Page_2.jpg?v=20260804" alt="Wild Eyez PDF page 2 safety section"></div>
    </section>
    <section class="page" data-time="155">
      <div class="page-head"><span>Page 3</span><span>What To Expect</span></div>
      <div class="page-body"><img src="assets/pages/WILD EYEZ PACKING AND PREPARATION GUIDE_Page_3.jpg?v=20260804" alt="Wild Eyez PDF page 3"></div>
    </section>
    <section class="page" data-time="235">
      <div class="page-head"><span>Page 4</span><span>Clothing & Footwear</span></div>
      <div class="page-body"><img src="assets/pages/WILD EYEZ PACKING AND PREPARATION GUIDE_Page_4.jpg?v=20260804" alt="Wild Eyez PDF page 4"></div>
    </section>
    <section class="page" data-time="330">
      <div class="page-head"><span>Page 5</span><span>Field Gear</span></div>
      <div class="page-body"><img src="assets/pages/WILD EYEZ PACKING AND PREPARATION GUIDE_Page_5.jpg?v=20260804" alt="Wild Eyez PDF page 5"></div>
    </section>
    <section class="page" data-time="380">
      <div class="page-head"><span>Page 6</span><span>Firearms & Ammunition</span></div>
      <div class="page-body"><img src="assets/pages/WILD EYEZ PACKING AND PREPARATION GUIDE_Page_6.jpg?v=20260804" alt="Wild Eyez PDF page 6"></div>
    </section>
    <section class="page" data-time="480">
      <div class="page-head"><span>Page 7</span><span>Preseason Preparation</span></div>
      <div class="page-body"><img src="assets/pages/WILD EYEZ PACKING AND PREPARATION GUIDE_Page_7.jpg?v=20260804" alt="Wild Eyez PDF page 7"></div>
    </section>
    <section class="page" data-time="615">
      <div class="page-head"><span>Page 8</span><span>Final Reminders</span></div>
      <div class="page-body"><img src="assets/pages/WILD EYEZ PACKING AND PREPARATION GUIDE_Page_8.jpg?v=20260804" alt="Wild Eyez PDF page 8"></div>
    </section>
    <section class="page" data-time="678">
      <div class="page-head"><span>Page 8</span><span>Closing Notes</span></div>
      <div class="page-body"><img src="assets/pages/WILD EYEZ PACKING AND PREPARATION GUIDE_Page_8.jpg?v=20260804" alt="Wild Eyez PDF page 8 closing"></div>
    </section>
  </main>

  <script>
    (() => {
      const audio = document.getElementById("guideAudio");
      const pages = Array.from(document.querySelectorAll(".page"));
      const title = document.querySelector(".title");
      const bar = document.querySelector(".bar");
      const prompt = document.getElementById("audioPrompt");
      let active = -1;
      let following = false;
      let raf = 0;
      let introHoldTimer = 0;
      let initialHoldTop = 0;
      let introTargetTop = 0;
      let endScrollTop = 0;
      let scrollPixelsPerSecond = 0;
      let scrollStartTime = 0;
      let scrollStartTop = 0;
      let phase = "intro";

      function pageTop(page){
        const barH = bar?.getBoundingClientRect().height || 0;
        return Math.max(0, window.scrollY + page.getBoundingClientRect().top - barH - 12);
      }

      function measureScrollRange(){
        const first = pages[0];
        const firstTop = pageTop(first);
        const firstHeight = first?.getBoundingClientRect().height || 0;
        const docMax = Math.max(0, document.documentElement.scrollHeight - window.innerHeight - 20);
        initialHoldTop = Math.max(0, firstTop);
        introTargetTop = Math.max(0, firstTop + firstHeight - window.innerHeight - 10);
        endScrollTop = docMax;
        const crawlSeconds = Math.max(1, (Number.isFinite(audio.duration) ? audio.duration : 678) - 10);
        scrollPixelsPerSecond = Math.max(0.1, (endScrollTop - introTargetTop) / crawlSeconds * 0.8);
      }

      function pageForTime(t){
        let idx = 0;
        pages.forEach((page, i) => {
          const start = parseFloat(page.dataset.time || "0");
          if (t >= start) idx = i;
        });
        return idx;
      }

      function updateActive(idx){
        if (idx === active) return;
        active = idx;
        pages.forEach((page, i) => page.classList.toggle("active", i === idx));
        const label = pages[idx]?.querySelector(".page-head span:last-child")?.textContent || "Continuous Document Test";
        title.textContent = label;
      }

      function scrollLoop(){
        if (!following || audio.paused) {
          following = false;
          return;
        }
        if (phase === "intro") {
          window.scrollTo({ top: introTargetTop, behavior: "auto" });
          if (Math.abs(window.scrollY - introTargetTop) < 3) {
            phase = "wait";
            following = false;
            return;
          }
        } else if (phase === "slow") {
          const elapsed = Math.max(0, audio.currentTime - scrollStartTime);
          const desired = Math.min(endScrollTop, scrollStartTop + (elapsed * scrollPixelsPerSecond));
          window.scrollTo({ top: desired, behavior: "auto" });
        }
        raf = requestAnimationFrame(scrollLoop);
      }

      function kickstart(){
        if (following) return;
        following = true;
        raf = requestAnimationFrame(scrollLoop);
      }

      function syncScrollToAudio(){
        measureScrollRange();
        const t = audio.currentTime || 0;
        if (t >= 10) {
          phase = "slow";
          window.scrollTo({ top: Math.min(endScrollTop, scrollStartTop + (Math.max(0, t - scrollStartTime) * scrollPixelsPerSecond)), behavior: "auto" });
        } else if (t > 0) {
          phase = "wait";
          window.scrollTo({ top: introTargetTop, behavior: "auto" });
        } else {
          phase = "intro";
          window.scrollTo({ top: initialHoldTop, behavior: "auto" });
        }
      }

      async function attemptAutoplay(){
        if (!audio) return;
        try{
          await audio.play();
        }catch{
          // Browser blocked autoplay; the visible play button remains available.
        }
      }

      function showPrompt(){
        prompt?.classList.add("show");
      }

      function hidePrompt(){
        prompt?.classList.remove("show");
      }

      audio.addEventListener("loadedmetadata", () => {
        measureScrollRange();
        window.scrollTo({ top: initialHoldTop, behavior: "auto" });
        showPrompt();
        if (introHoldTimer) clearTimeout(introHoldTimer);
        scrollStartTime = 0;
        scrollStartTop = introTargetTop;
        phase = "intro";
        introHoldTimer = window.setTimeout(() => {
          attemptAutoplay();
          scrollStartTime = audio.currentTime || 0;
          scrollStartTop = introTargetTop;
          phase = "intro";
          kickstart();
        }, 5000);
      });
      audio.addEventListener("play", () => {
        if (introHoldTimer) clearTimeout(introHoldTimer);
        hidePrompt();
        if (!following) {
          scrollStartTime = audio.currentTime || 0;
          scrollStartTop = introTargetTop;
        }
        syncScrollToAudio();
        kickstart();
      });
      audio.addEventListener("timeupdate", () => {
        if (phase === "wait" && audio.currentTime >= 10) {
          phase = "slow";
          scrollStartTime = 10;
          scrollStartTop = introTargetTop;
          window.scrollTo({ top: introTargetTop, behavior: "auto" });
          kickstart();
        }
        if (following) kickstart();
      });
      audio.addEventListener("seeked", () => {
        scrollStartTime = audio.currentTime || 0;
        scrollStartTop = introTargetTop;
        syncScrollToAudio();
        kickstart();
      });
      audio.addEventListener("pause", () => {
        if (raf) cancelAnimationFrame(raf);
        following = false;
        if (introHoldTimer) clearTimeout(introHoldTimer);
      });

      measureScrollRange();
      window.scrollTo({ top: initialHoldTop, behavior: "auto" });
    })();
  </script>
</body>
</html>
